name: Coletar dados

on:
  schedule:
    # Brasília é UTC-3 (sem horário de verão); Cuiabá é UTC-4. O Gustavo abre o painel às ~07:30 de Cuiabá (08:30 de Brasília).
    # O GitHub atrasa e descarta muitos disparos agendados (02 e 03/11/2026: chegaram ~1 em cada 10). Por isso há
    # disparos de sobra, e cada rodada decide pelo estado o que falta (coletar.py auto): Yahoo e Banco Central sempre;
    # Imea no máximo 2 vezes por dia, a 2ª a partir das 17h. Rodada a mais sem dado novo não faz commit.
    - cron: "4,19,34,49 7-11 * * 1-5" # 04:04 a 08:49 Brasília, a cada 15 min (janela antes do Gustavo abrir)
    - cron: "7,37 12-23 * * 1-5"      # 09:07 a 20:37 Brasília, a cada 30 min (pregão e 2ª leitura do Imea)
  workflow_dispatch:
    inputs:
      fontes:
        description: "auto (decide pelo estado) ou fontes separadas por espaço (yahoo sgs imea)"
        default: "auto"
      agora:
        description: "Só para teste: simula o relógio (ex. 2026-11-03T07:00-03:00)"
        default: ""
      falha:
        description: "Só para teste: séries que devem falhar (ex. yahoo/nasdaq)"
        default: ""

permissions:
  contents: write
  actions: read   # o vigia lê a lista de rodadas deste workflow

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar
        id: coletar
        continue-on-error: true
        env:
          FONTES: ${{ inputs.fontes || 'auto' }}
          COLETA_AGORA: ${{ inputs.agora }}
          COLETA_FALHA: ${{ inputs.falha }}
        run: python coletor/coletar.py $FONTES
      - name: Salvar dados no repositório (só se algo mudou)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git pull --rebase -q
            git push
          fi
      - name: Vigia (o painel estava atualizado às 07:30 de Cuiabá?)
        id: vigia
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLETA_AGORA: ${{ inputs.agora }}
        run: python coletor/vigia.py
      - name: Falhar se alguma fonte falhou ou se o robô não rodou a tempo
        if: steps.coletar.outcome == 'failure' || steps.vigia.outcome == 'failure'
        run: |
          [ "${{ steps.coletar.outcome }}" = failure ] && echo "Alguma fonte falhou. Veja o resumo da execução."
          [ "${{ steps.vigia.outcome }}" = failure ] && echo "O robô não rodou entre 17h da véspera e 08:30 (Brasília). Veja o resumo da execução."
          exit 1

name: Coletar dados

on:
  schedule:
    # Brasília é UTC-3 (sem horário de verão). Minutos 7 e 37 para fugir do pico de início de hora.
    - cron: "7 9 * * 1-5"        # 06:07 Brasília, dias úteis: todas as fontes (Yahoo, Banco Central, Imea)
    - cron: "7,37 13-20 * * 1-5" # 10:07 a 17:37 Brasília, a cada 30 min: só Yahoo
    - cron: "7 21 * * 1-5"       # 18:07 Brasília: Yahoo e Imea (2ª e última leitura do Imea no dia)
  workflow_dispatch:
    inputs:
      fontes:
        description: "Fontes a coletar (yahoo, sgs, imea), separadas por espaço"
        default: "yahoo sgs imea"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar
        id: coletar
        continue-on-error: true
        env:
          FONTES: ${{ github.event_name == 'schedule' && (github.event.schedule == '7 9 * * 1-5' && 'yahoo sgs imea' || github.event.schedule == '7 21 * * 1-5' && 'yahoo imea' || 'yahoo') || inputs.fontes || 'yahoo sgs imea' }}
        run: python coletor/coletar.py $FONTES
      - name: Salvar dados no repositório (só se algo mudou)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git pull --rebase -q
            git push
          fi
      - name: Falhar se alguma fonte falhou
        if: steps.coletar.outcome == 'failure'
        run: |
          echo "Alguma fonte falhou. Veja o resumo da execução."
          exit 1

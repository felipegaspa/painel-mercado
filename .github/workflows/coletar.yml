name: Coletar dados
# O título mostra quem disparou: "Apps Script" = disparador externo (Google Apps Script do Felipe).
run-name: ${{ inputs.origem == 'apps-script' && 'Coletar dados · Apps Script' || 'Coletar dados' }}

on:
  # Disparador principal: Google Apps Script do Felipe chama workflow_dispatch de hora em hora (05h–20h de
  # Brasília, dias úteis); ver disparador/apps-script.gs e SPEC 4.6. O agendamento abaixo é só RESERVA:
  # o cron do GitHub é "melhor esforço" e em 02–03/11/2026 entregou ~1 em cada 10 disparos.
  # Cada rodada decide pelo estado (coletar.py auto): Yahoo e Banco Central sempre; Imea no máximo 2 por dia.
  schedule:
    - cron: "19 9-11 * * 1-5"            # 06:19, 07:19, 08:19 Brasília (reserva da manhã)
    - cron: "37 13,15,17,19,21,23 * * 1-5" # 10:37 a 20:37 Brasília, a cada 2 h (reserva do dia)
  workflow_dispatch:
    inputs:
      origem:
        description: "Quem disparou (o Apps Script manda apps-script; só muda o título)"
        default: ""
      fontes:
        description: "Só em branch de teste (na main é sempre auto): fontes separadas por espaço (yahoo sgs imea)"
        default: "auto"
      agora:
        description: "Só em branch de teste (ignorado na main): simula o relógio (ex. 2026-11-03T07:00-03:00)"
        default: ""
      falha:
        description: "Só em branch de teste (ignorado na main): séries que devem falhar (ex. yahoo/nasdaq)"
        default: ""

permissions:
  contents: write
  actions: read   # o vigia lê a lista de rodadas deste workflow

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar
        id: coletar
        continue-on-error: true
        env:
          # Na main, opções de teste são ignoradas: quem tiver o token do disparador só consegue mandar "rodar normal".
          FONTES: ${{ github.ref == 'refs/heads/main' && 'auto' || inputs.fontes || 'auto' }}
          COLETA_AGORA: ${{ github.ref != 'refs/heads/main' && inputs.agora || '' }}
          COLETA_FALHA: ${{ github.ref != 'refs/heads/main' && inputs.falha || '' }}
        run: python coletor/coletar.py $FONTES
      - name: Salvar dados no repositório (só se algo mudou)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git pull --rebase -q
            git push
          fi
      - name: Vigia (o painel estava atualizado às 07:30 de Cuiabá? o disparador do Google está vivo?)
        id: vigia
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLETA_AGORA: ${{ github.ref != 'refs/heads/main' && inputs.agora || '' }}
        run: python coletor/vigia.py
      - name: Falhar se alguma fonte falhou ou se o vigia achou problema
        if: steps.coletar.outcome == 'failure' || steps.vigia.outcome == 'failure'
        run: |
          [ "${{ steps.coletar.outcome }}" = failure ] && echo "Alguma fonte falhou. Veja o resumo da execução."
          [ "${{ steps.vigia.outcome }}" = failure ] && echo "O vigia achou problema. Veja o resumo da execução."
          exit 1

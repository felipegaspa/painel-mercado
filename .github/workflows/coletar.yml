name: Coletar dados

on:
  schedule:
    # Brasília é UTC-3 (sem horário de verão). Minutos 7 e 37 para fugir do pico de início de hora.
    # O GitHub atrasa e descarta disparos agendados; por isso cada rodada decide pelo estado o que falta
    # (coletar.py auto): Yahoo e Banco Central sempre; Imea no máximo 2 vezes por dia, a 2ª a partir das 17h.
    - cron: "7 9 * * 1-5"        # 06:07 Brasília, dias úteis
    - cron: "7,37 13-22 * * 1-5" # 10:07 a 19:37 Brasília, a cada 30 min
  workflow_dispatch:
    inputs:
      fontes:
        description: "auto (decide pelo estado) ou fontes separadas por espaço (yahoo sgs imea)"
        default: "auto"
      agora:
        description: "Só para teste: simula o relógio (ex. 2026-11-03T07:00-03:00)"
        default: ""
      falha:
        description: "Só para teste: séries que devem falhar (ex. yahoo/nasdaq)"
        default: ""

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar
        id: coletar
        continue-on-error: true
        env:
          FONTES: ${{ inputs.fontes || 'auto' }}
          COLETA_AGORA: ${{ inputs.agora }}
          COLETA_FALHA: ${{ inputs.falha }}
        run: python coletor/coletar.py $FONTES
      - name: Salvar dados no repositório (só se algo mudou)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git pull --rebase -q
            git push
          fi
      - name: Falhar se alguma fonte falhou
        if: steps.coletar.outcome == 'failure'
        run: |
          echo "Alguma fonte falhou. Veja o resumo da execução."
          exit 1

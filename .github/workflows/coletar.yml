name: Coletar dados

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar
        id: coletar
        continue-on-error: true
        run: python coletor/coletar.py
      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi
      - name: Falhar se alguma fonte falhou
        if: steps.coletar.outcome == 'failure'
        run: |
          echo "Alguma fonte falhou. Veja o resumo da execução."
          exit 1
